<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#102b29">
  <title>QuoteTend</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app/fonts.css">
  <link rel="stylesheet" href="/shared/tokens.css">
  <link rel="stylesheet" href="/shared/app.css">
  <link rel="stylesheet" href="/app/shell.css">
  <script type="module" src="/app/main.js"></script>
</head>
<body class="qt-app">
  <a class="skip-link" href="#app-main">Skip to content</a>
  <div class="app" data-app>
    <aside class="app-side" id="app-nav" aria-label="QuoteTend workspace">
      <a class="app-brand" href="#overview" data-nav="overview" aria-label="QuoteTend overview"></a>
      <div class="app-ws">
        <span class="app-ws__mark" aria-hidden="true" data-ws-mark></span>
        <div><strong data-ws-name>Loading…</strong><small data-ws-sub></small></div>
      </div>
      <nav class="app-nav" aria-label="Workspace sections">
        <p class="app-label" aria-hidden="true">Workspace</p>
        <ul data-nav-list></ul>
      </nav>
      <div class="app-side__foot">
        <a class="app-side__btn" href="#settings" data-nav="settings" data-icon="settings">Settings &amp; data</a>
        <a class="app-side__btn" href="/security" data-icon="shield">Account security</a>
        <button class="app-side__btn" type="button" data-action="sign-out" data-icon="logout">Sign out</button>
        <div class="app-side__user"><span class="qt-avatar" aria-hidden="true" data-user-mark></span><div><strong>Owner</strong><small data-user-email></small></div></div>
        <p class="app-side__note">QuoteTend never sends messages. You follow up from your own email, phone or text app, then log what happened.</p>
      </div>
    </aside>
    <div class="app-scrim" data-nav-scrim hidden></div>

    <div class="app-shell">
      <header class="app-top">
        <button class="app-menu" type="button" aria-controls="app-nav" aria-expanded="false" data-nav-toggle aria-label="Open navigation"></button>
        <p class="app-crumb"><span data-crumb-business></span><span aria-hidden="true">/</span><strong data-crumb>Overview</strong></p>
        <form class="app-search" role="search" data-form="global-search">
          <label class="sr-only" for="global-search">Search estimates</label>
          <input id="global-search" type="search" name="q" placeholder="Search customers, jobs, addresses…" autocomplete="off" maxlength="200">
        </form>
        <span class="app-pill" data-pill><i aria-hidden="true"></i><span data-pill-text>Private account</span></span>
        <button class="app-cta" type="button" data-action="add" aria-label="Add estimate" data-icon="plus"><span>Add estimate</span></button>
      </header>
      <div class="app-banner" data-banner role="alert" hidden></div>
      <main id="app-main" class="app-main qt" tabindex="-1" data-main>
        <div class="app-loading" role="status"><span class="spinner" aria-hidden="true"></span><p>Loading your workspace…</p></div>
        <noscript><p>QuoteTend needs JavaScript to run.</p></noscript>
      </main>
    </div>
  </div>

  <div class="drawer-scrim" data-drawer-scrim hidden></div>
  <aside class="drawer qt" role="dialog" aria-modal="true" aria-labelledby="drawer-title" data-drawer hidden></aside>
  <dialog class="confirm qt" data-confirm aria-labelledby="confirm-title" aria-describedby="confirm-body"></dialog>
  <dialog class="editor qt" data-editor aria-labelledby="editor-title"></dialog>
  <dialog class="editor qt" data-export aria-labelledby="export-title"></dialog>
  <div class="toast" role="status" aria-live="polite" data-toast></div>
</body>
</html>
